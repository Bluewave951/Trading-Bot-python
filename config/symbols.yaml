# Watchlist: which instruments to analyze, grouped by asset class.
# `source` must be one of: yfinance | okx | tradingview

watchlist:
  stock:
    - ticker: AAPL
      source: yfinance
    - ticker: NVDA
      source: yfinance
    - ticker: TSLA
      source: yfinance
    - ticker: SPY
      source: yfinance

  crypto:
    - ticker: BTC/USDT
      source: okx
    - ticker: ETH/USDT
      source: okx
    - ticker: SOL/USDT
      source: okx

  commodity:
    - ticker: GC=F        # Gold futures (yfinance) — XAUUSD=X was dropped,
      source: yfinance    # Yahoo Finance no longer serves that symbol
